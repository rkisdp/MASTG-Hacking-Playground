# The name of our workflow
name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      riskThreshold:
        description: "Risk Threshold"
        required: false
        default: CRITICAL

permissions:
  contents: write
  pull-requests: write

env:
  RISK_THRESHOLD: CRITICAL
  APPKNOX_ACCESS_TOKEN: 12113443ec9b5c141adc459f9afec11830d709d4
  APPKNOX_API_HOST: https://autofix.staging.appknox.io/
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set risk threshold for push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ env.RISK_THRESHOLD }}" >> $GITHUB_ENV
      - name: Set risk threshold for workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RISK_THRESHOLD=${{ github.event.inputs.riskThreshold }}" >> $GITHUB_ENV
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
      - name: Grant execute permission for gradlew
        working-directory: Android/MASTG-Android-Kotlin-App
        run: chmod +x gradlew
      # Anko 0.10.4, Fuel 1.12.1 (+ its Result dependency) and securestoragelibrary 0.0.2
      # were JCenter-only and are gone from Maven Central and jcenter.bintray.com.
      # Aliyun's JCenter mirror still has them; exclusiveContent restricts that mirror
      # to exactly these groups so nothing else is resolved from it.
      - name: Create Gradle init script for retired JCenter libraries
        run: |
          cat > "$RUNNER_TEMP/jcenter-mirror.gradle" <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      mavenCentral()
                  }
              }
              repositories {
                  mavenCentral()
                  exclusiveContent {
                      forRepository {
                          maven { url 'https://maven.aliyun.com/repository/jcenter' }
                      }
                      filter {
                          includeGroup 'org.jetbrains.anko'
                          includeGroup 'com.github.kittinunf.fuel'
                          includeGroup 'com.github.kittinunf.result'
                          includeGroup 'de.adorsys.android'
                      }
                  }
              }
          }
          EOF
      - name: Build the app
        working-directory: Android/MASTG-Android-Kotlin-App
        timeout-minutes: 30
        run: ./gradlew bundleDebug --no-daemon -I "$RUNNER_TEMP/jcenter-mirror.gradle"
      - uses: actions/upload-artifact@v4
        with:
          name: mastg-android.aab
          path: Android/MASTG-Android-Kotlin-App/app/build/outputs/bundle/debug/app-debug.aab
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Checkout appknox-go
        uses: actions/checkout@v4
        with:
          repository: appknox/appknox-go
          ref: feature/knoxfixer
          path: appknox-go
      - name: Build appknox CLI
        working-directory: appknox-go
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          go build -o "$GITHUB_WORKSPACE/bin/appknox" .
      - name: Upload app and run Appknox cicheck
        id: appknox_scan
        continue-on-error: true
        run: |
          FILE_ID=$(./bin/appknox upload Android/MASTG-Android-Kotlin-App/app/build/outputs/bundle/debug/app-debug.aab --knoxiq)
          echo "Uploaded file id: $FILE_ID"
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          ./bin/appknox cicheck "$FILE_ID" --risk-threshold "${RISK_THRESHOLD}"
      - name: Run Appknox autofix
        if: steps.appknox_scan.outputs.file_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APPKNOX=./bin/appknox
          FILE_ID="${{ steps.appknox_scan.outputs.file_id }}"
          $APPKNOX knoxfixer --file-id "$FILE_ID"
      - name: Fail if cicheck found issues
        if: steps.appknox_scan.outcome == 'failure'
        run: exit 1
